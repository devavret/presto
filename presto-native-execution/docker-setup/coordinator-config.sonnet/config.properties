coordinator=true
node-scheduler.include-coordinator=false
http-server.http.port=8080
discovery-server.enabled=true
discovery.uri=http://presto-coordinator:8080

# Set presto version to match worker
presto.version=testversion

# Query execution settings
query.max-memory=2GB
query.max-memory-per-node=1GB
query.max-total-memory-per-node=1GB

query-manager.required-workers=1

# This didn't fix the issue where queries were killed after 3s
#experimental.task.info-update-refresh-max-wait=30s

# This fixed the timeout issue after 3 seconds but max allowed value is 10s.
task.status-refresh-max-wait=10s
task.info-update-interval=10s

# Enable native worker support
# This is the proper solution: enables coordinator to recognize native workers as active
native-execution-enabled=true

single-node-execution-enabled=true

# Alternative "hack" approach (NOT recommended):
# If coordinator doesn't recognize native workers as active, you could force the 
# coordinator to act as a worker to satisfy the minimum worker requirement:
# node-scheduler.include-coordinator=true
# However, this is not the correct architectural approach - the proper solution
# is to enable native-execution-enabled=true above so the coordinator properly
# recognizes native Prestissimo workers.

# experimental.native-execution-executable-path=/opt/presto-server/bin/presto_server
# experimental.native-execution-program-arguments=--etc-dir=/opt/presto-server/etc

# From Zoltan:
# Needed for analyze to work correctly.
use-alternative-function-signatures=false

# Configs only for the coordinator of a Prestissmo cluster
# Without this, you might see errors like "Scalar function name not registered: presto.default.$operator$hash_code, called with arguments: (BIGINT)."
optimizer.optimize-hash-generation=false
